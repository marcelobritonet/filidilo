<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <!-- P134: o app fica no tamanho do manual da marca mesmo com a fonte ou o zoom do sistema aumentados
         (ver o script de compensação abaixo); o CSS usa px, então esta meta não aumenta a letra. -->
    <meta name="text-scale" content="scale" />
    <meta name="theme-color" content="#0B1E3F" />
    <meta name="description" content="Aprenda qualquer coisa: flashcards com IA, estudados no seu ritmo, offline" />
    <!-- Prévia do link no WhatsApp e afins (vale para todo link, inclusive os de baralho ?b=…). Endereço absoluto:
         o WhatsApp não aceita relativo. Imagem gerada de scripts/og-imagem.html; ao trocar, suba o ?v=. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Filidilo" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Filidilo: flashcards com IA" />
    <meta property="og:description" content="Aprenda qualquer coisa: flashcards com IA, estudados no seu ritmo, offline" />
    <meta property="og:image" content="https://marcelobritonet.github.io/filidilo/og-imagem.png?v=1" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo do Filidilo: aprenda qualquer coisa com flashcards" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="icon.svg?v=4" type="image/svg+xml" />
    <link rel="icon" href="favicon-32.png?v=4" type="image/png" sizes="32x32" />
    <link rel="icon" href="favicon-16.png?v=4" type="image/png" sizes="16x16" />
    <link rel="shortcut icon" href="favicon.ico?v=4" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=3" />
    <title>Filidilo</title>
    <script>
      // Liberações por aparelho, pelo endereço: ?diag=1|0 (medidas de tela no rodapé, P134). Grava ou tira a chave e o parâmetro
      // sai do endereço.
      try {
        var q = new URLSearchParams(location.search)
        var flags = { diag: 'tatino-diag' }
        var mudou = false
        for (var f in flags) {
          var v = q.get(f)
          if (v === '1' || v === '0') {
            if (v === '1') localStorage.setItem(flags[f], '1')
            else localStorage.removeItem(flags[f])
            q.delete(f)
            mudou = true
          }
        }
        if (mudou) {
          var resto = q.toString()
          history.replaceState(history.state, '', location.pathname + (resto ? '?' + resto : '') + location.hash)
        }
      } catch (e) {}
      // P134: no celular, a fonte ou o zoom do sistema chegam como zoom da página (o Chrome encolhe a largura
      // útil: 412px viram ~317px e tudo fica 30% maior, a splash sai do centro). Aqui o app desfaz esse zoom
      // e volta ao tamanho do manual da marca. Fator = largura da tela / largura da janela; só em tela de toque
      // de celular. A chave tatino-fator-teste força um fator, para testar no computador.
      try {
        var raiz = document.documentElement
        var medirZoom = function () {
          var f = 1
          var teste = parseFloat(localStorage.getItem('tatino-fator-teste') || '')
          if (teste > 0) f = teste
          else if (matchMedia('(pointer: coarse)').matches && screen.width <= 900 && innerWidth > 0) {
            var r = screen.width / innerWidth
            if (r > 1.04 && r < 3) f = r
          }
          window.__fatorZoom = f
          raiz.style.zoom = f === 1 ? '' : String(1 / f)
          // vw/vh/dvh encolhem junto com o zoom: o CSS multiplica por --z (estilo.css) para seguirem a tela inteira
          raiz.style.setProperty('--z', String(f))
        }
        medirZoom()
        addEventListener('resize', medirZoom)
      } catch (e) {}
      // Aplica o tema antes de pintar a tela (evita piscar claro→escuro). Lógica completa em src/ui/tema.ts.
      try {
        // tema gravado → [tipo, paleta]; igual a TEMAS em src/ui/tema.ts ('light' antigo = Areia)
        var temas = { light: ['light', 'areia'], lagoa: ['light', 'lagoa'], plumagem: ['light', 'plumagem'], ocelo: ['light', 'ocelo'], areia: ['light', 'areia'], dark: ['dark', 'noite'], cobalto: ['dark', 'cobalto'], pavao: ['dark', 'pavao'] }
        var p = localStorage.getItem('tatino-theme')
        var t = temas.hasOwnProperty(p) ? temas[p] : null
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? temas.dark : temas.areia
        document.documentElement.dataset.theme = t[0]
        document.documentElement.dataset.paleta = t[1]
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
        document.documentElement.dataset.paleta = 'areia'
      }
      // Estilo: igual a lerEstilo em src/ui/tema.ts. Suave é o padrão; Clássico só para quem escolheu.
      try {
        document.documentElement.dataset.estilo = localStorage.getItem('tatino-estilo') === 'classico' ? 'classico' : 'suave'
      } catch (e) {
        document.documentElement.dataset.estilo = 'suave'
      }
      // A abertura (src/ui/Abertura.tsx) começa em fundo Noite: pinta a página e a barra do navegador assim
      // desde o primeiro quadro; a cor do tema volta quando a abertura sai.
      document.documentElement.classList.add('abrindo')
    </script>
    <style>html.abrindo, html.abrindo body { background: #0B1E3F; }</style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
