# Links temporários do tatino.: guarda um baralho ou cartões por 2 horas e devolve por um código.
# Publicado pelo .github/workflows/deploy-worker.yml (segredos CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID).
name = "tatino-links"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

# O wrangler cria o namespace KV no primeiro deploy (sem "id") e guarda a ligação na conta.
[[kv_namespaces]]
binding = "LINKS"

# No máximo 20 links novos por minuto por IP.
[[ratelimits]]
name = "LIMITE"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[vars]
ORIGENS = "https://marcelobritonet.github.io,http://localhost:5173,http://localhost:4173"
