# Links do Filidilo: guarda um baralho ou cartões (30 dias; 2h para apps antigos) e devolve por um código.
# A página pública do link, com a prévia do WhatsApp, é o worker "filidilo" (wrangler.pagina.toml), no mesmo KV.
# Publicado pelo .github/workflows/deploy-worker.yml (segredos CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID).
# Antes "tatino-links" (apagado em 25/11/2026). O KV continua o mesmo.
name = "filidilo-links"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

# Namespace KV criado no primeiro deploy do tatino-links ("tatino-links-links"). O id fixo faz o
# filidilo-links usar os mesmos dados: os links já enviados continuam abrindo.
[[kv_namespaces]]
binding = "LINKS"
id = "ae8549ab23824f36bf4aeb5d18ee6aef"

# No máximo 20 links novos por minuto por IP.
[[ratelimits]]
name = "LIMITE"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[vars]
ORIGENS = "https://marcelobritonet.github.io,http://localhost:5173,http://localhost:4173"
